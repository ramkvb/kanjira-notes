<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8a838"/>
      <stop offset="100%" stop-color="#c47f20"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="#1a1a2e"/>
  <!-- Drum body -->
  <ellipse cx="256" cy="280" rx="150" ry="40" fill="#2a2a45" stroke="url(#g)" stroke-width="4"/>
  <rect x="106" y="180" width="300" height="100" fill="#2a2a45"/>
