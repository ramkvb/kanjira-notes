  <path d="M 256 125 Q 280 110 256 95" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M 256 120 Q 290 100 256 80" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" opacity="0.2"/>
  <!-- Text -->
